name: Build and release WebCanvas

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0 (blank uses the newest tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag to build
        id: tag
        shell: bash
        run: |
          tag=""

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [[ -z "$tag" ]]; then
            echo "No release tag found. Push a v* tag or supply one manually."
          else
            echo "Building release $tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: WebCanvas-win-x64
            archive: WebCanvas-win-x64.zip

          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact: WebCanvas-linux-x64
            archive: WebCanvas-linux-x64.tar.gz

          - name: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            artifact: WebCanvas-macos-arm64
            archive: WebCanvas-macos-arm64.tar.gz

          - name: macOS Intel
            os: macos-latest
            rid: osx-x64
            artifact: WebCanvas-macos-x64
            archive: WebCanvas-macos-x64.tar.gz

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Check out Donkeh UI
        shell: pwsh
        run: |
          $target = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "../../UI Framework/CSS-Engine"))
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          git clone --depth 1 https://github.com/barely-sentient/donkeh-ui.git $target

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install CSX tool
        run: dotnet tool install --global CSX.CliTool --version 1.0.1

      - name: Transform CSX sources
        run: csx build --configuration Release

      - name: Publish folder build
        # Keep this as a normal folder publish. The app is shipped as a folder
        # of assemblies and native dependencies, never as a single executable.
        run: >
          dotnet publish WebCanvasDotNet.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify folder output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/WebCanvasDotNet.exe") -and -not (Test-Path "publish/WebCanvasDotNet")) {
            throw "Expected a folder publish with the WebCanvas executable."
          }

          Get-ChildItem publish | Select-Object Name, Length

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "${{ matrix.archive }}" -Force

      - name: Package for Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C publish .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish latest release
    needs: [resolve, build]
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: WebCanvas ${{ needs.resolve.outputs.tag }}
          files: dist/*
          overwrite_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
