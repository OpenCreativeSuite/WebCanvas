name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: WebCanvasDotNet.Tests
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check out Donkeh UI
        shell: pwsh
        run: |
          $target = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "../../UI Framework/CSS-Engine"))
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          git clone --depth 1 https://github.com/barely-sentient/donkeh-ui.git $target

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install CSX tool
        run: dotnet tool install --global CSX.CliTool --version 1.0.1

      - name: Transform CSX sources
        run: csx build --configuration Release

      - name: Restore
        run: dotnet restore tests/WebCanvasDotNet.Tests/WebCanvasDotNet.Tests.csproj

      - name: Test
        run: >
          dotnet test tests/WebCanvasDotNet.Tests/WebCanvasDotNet.Tests.csproj
          --no-restore
          --configuration Release
          --logger "console;verbosity=normal"

